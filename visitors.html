<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>زوار الموقع — تنوركو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f1ea;--surface:#fff;--ink:#2b1a10;--muted:#7a6a5e;--line:#e5dacd;--brand:#d9691f;--danger:#c0392b;--ok:#1e8e3e;--soft:#fbf6ef;--bar:#f3dcc7}
@media (prefers-color-scheme:dark){:root{--bg:#17110d;--surface:#221912;--ink:#f6ece0;--muted:#b3a291;--line:#3a2b20;--soft:#1c1510;--bar:#4a2c17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.login{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.login form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 18px;text-align:center}
.login h1{font-size:20px;margin:0 0 4px}.login p{margin:0 0 16px;color:var(--muted);font-size:14px}
.login input{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:12px}
.login .btn{width:100%;padding:12px;font-size:16px}.err{color:var(--danger);font-size:14px;min-height:20px;margin-top:10px}
.top{position:sticky;top:0;z-index:1000;background:var(--ink);color:var(--bg);display:flex;gap:6px;align-items:center;padding:8px 12px}
.top b{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top a,.top .lnk{color:var(--bg);background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 10px;font-size:13px;text-decoration:none;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:14px 16px 40px}
.ranges{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:100px;padding:7px 14px;cursor:pointer;font-weight:700;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px;font-weight:700}
.kpi.live .v{color:var(--ok)}
.kpi.live .v::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-inline-end:6px;vertical-align:middle;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;min-width:0}
.card h2{font-size:16px;margin:0 0 10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols .card{margin-bottom:0}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
.stack{display:grid;gap:12px;margin-bottom:12px}
#map{height:360px;border-radius:10px;overflow:hidden;background:var(--soft)}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bars li{position:relative;display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;overflow:hidden;font-size:14px}
.bars li .fill{position:absolute;inset-block:0;inset-inline-start:0;background:var(--bar);border-radius:8px;z-index:0}
.bars li span{position:relative;z-index:1}
.bars li .n{margin-inline-start:auto;font-weight:800;font-variant-numeric:tabular-nums}
.bars li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.days{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:18px}
.days .d{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.days .d i{display:block;width:100%;max-width:28px;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.days .d b{font-size:11px;font-variant-numeric:tabular-nums}
.days .d small{font-size:10px;color:var(--muted);white-space:nowrap}
.recent{list-style:none;margin:0;padding:0}
.recent li{padding:8px 2px;border-bottom:1px solid var(--line)}.recent li:last-child{border-bottom:0}
.recent .r1{display:flex;gap:8px;justify-content:space-between;font-weight:700;font-size:14px}
.recent .r2{color:var(--muted);font-size:13px}
.recent .t{white-space:nowrap;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:14px;font-size:14px}
.setup{background:var(--soft);border:1px dashed var(--brand);border-radius:12px;padding:14px;font-size:14px}
.setup pre{direction:ltr;text-align:left;white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;max-height:240px;overflow:auto}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.foot label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-weight:700}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:3000;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.leaflet-container{font-family:'Tajawal',system-ui,sans-serif}
</style>
</head>
<body>
<div class="login" id="loginView"><form id="loginForm">
  <h1>👥 زوار الموقع</h1><p>مين زار موقع تنوركو ومن وين — للمشرف فقط</p>
  <input id="em" type="hidden" value="admin@tanourko-menu.com" autocomplete="username">
  <input id="pw" type="password" placeholder="كلمة المرور" required autocomplete="current-password" aria-label="كلمة المرور">
  <button class="btn primary" id="loginBtn">دخول</button><div class="err" id="loginErr" role="alert"></div>
</form></div>

<div class="top"><b>👥 زوار الموقع وأماكنهم</b><button class="lnk" id="refresh" type="button">🔄 تحديث</button><a href="admin.html">اللوحات</a><button class="lnk" id="logout" type="button">خروج</button></div>
<main id="main">
  <div class="ranges" role="group" aria-label="الفترة">
    <button class="chip" data-r="today" aria-pressed="true">اليوم</button>
    <button class="chip" data-r="7" aria-pressed="false">آخر 7 أيام</button>
    <button class="chip" data-r="30" aria-pressed="false">آخر 30 يوم</button>
    <button class="chip" data-r="90" aria-pressed="false">آخر 90 يوم</button>
  </div>
  <div id="body"><div class="empty">جارٍ التحميل…</div></div>
  <div class="foot">
    <label><input type="checkbox" id="notrack"> لا تحسب زياراتي من هذا الجهاز</label>
    <button class="btn" id="purge" type="button">🧹 حذف الزيارات الأقدم من سنة</button>
    <span id="updated"></span>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
"use strict";
var SB_URL='https://iekotptltmkjmieauhqc.supabase.co';
var SB_KEY='sb_publishable_35u5V1apSr2-DCpjp8ltmg_gIJzhXEN';
var MAX_ROWS=20000;
var $=function(id){return document.getElementById(id)};
var loadedRange=null, mapView=null;
var sb=null, range='today', rows=[], map=null, layer=null, timer=null, busy=false;

var SQL="create table if not exists public.site_visits (\n  id bigint generated always as identity primary key,\n  created_at timestamptz not null default now(),\n  visitor text, session text, page text, source text, ref text,\n  country text, country_code text, region text, city text,\n  lat double precision, lon double precision,\n  tz text, lang text, device text, os text, browser text, screen text\n);\ncreate index if not exists site_visits_created_idx on public.site_visits (created_at desc);\nalter table public.site_visits enable row level security;\ngrant insert on public.site_visits to anon, authenticated;\ngrant select, delete on public.site_visits to authenticated;\ndrop policy if exists \"log visits\" on public.site_visits;\ncreate policy \"log visits\" on public.site_visits for insert to anon, authenticated\n  with check (char_length(coalesce(page,''))<=120 and char_length(coalesce(ref,''))<=250 and char_length(coalesce(visitor,''))<=40);\ndrop policy if exists \"admins read visits\" on public.site_visits;\ncreate policy \"admins read visits\" on public.site_visits for select to authenticated\n  using (exists (select 1 from public.menu_admins m where lower(m.email)=lower(auth.jwt()->>'email')));\ndrop policy if exists \"admins delete visits\" on public.site_visits;\ncreate policy \"admins delete visits\" on public.site_visits for delete to authenticated\n  using (exists (select 1 from public.menu_admins m where lower(m.email)=lower(auth.jwt()->>'email')));";

var PAGES={'tanourko-links.html':'🏠 الموقع الرئيسي','index.html':'🏠 الموقع الرئيسي','menu.html':'📖 المنيو','buffets.html':'🥘 البوفيهات','rate-staff.html':'⭐ تقييم الموظفين','tanourko-loyalty.html':'🎁 بطاقة الولاء','leaderboard.html':'🏆 ترتيب الموظفين'};
var SOURCES={direct:'🔗 رابط مباشر / QR',internal:'↩️ من صفحة ثانية في الموقع',app:'📱 تطبيق تنوركو',google:'🔎 جوجل',instagram:'📸 إنستغرام',snapchat:'👻 سناب شات',tiktok:'🎵 تيك توك',facebook:'📘 فيسبوك',whatsapp:'💬 واتساب',linktree:'🌳 Linktree',qr:'🔳 QR',other:'أخرى'};
var DEVICES={mobile:'📱 جوال',tablet:'📲 تابلت',desktop:'💻 كمبيوتر'};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var tt;function toast(m,ms){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},ms||2600)}
function num(n){return Number(n).toLocaleString('en-US')}
function flag(cc){cc=(cc||'').toUpperCase();if(!/^[A-Z]{2}$/.test(cc))return '🌐';return String.fromCodePoint(127397+cc.charCodeAt(0),127397+cc.charCodeAt(1))}
var regionNames=null;try{regionNames=new Intl.DisplayNames(['ar'],{type:'region'})}catch(e){}
function countryName(r){if(r.country_code&&regionNames){try{return regionNames.of(r.country_code.toUpperCase())}catch(e){}}return r.country||'غير معروف'}
function pageName(p){return PAGES[p]||p||'—'}
function sourceName(s){return SOURCES[s]||s||'—'}
function since(){
  var d=new Date();
  if(range==='today'){d.setHours(0,0,0,0);return d}
  d.setHours(0,0,0,0);d.setDate(d.getDate()-(+range-1));return d;
}
function ago(t){
  var s=Math.round((Date.now()-new Date(t).getTime())/1000);
  if(s<60)return 'الحين';if(s<3600)return 'قبل '+Math.floor(s/60)+' د';if(s<86400)return 'قبل '+Math.floor(s/3600)+' س';
  return new Date(t).toLocaleString('ar-AE',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
}

/* ---------- login ---------- */
if(!window.supabase){$('loginErr').textContent='تعذر تحميل نظام الدخول. تأكد من الإنترنت.';return}
sb=window.supabase.createClient(SB_URL,SB_KEY);
async function enter(user){
  var r=await sb.from('menu_admins').select('email').ilike('email',user.email).maybeSingle();
  if(r.error||!r.data){await sb.auth.signOut();$('loginErr').textContent='هذا الحساب ما عنده صلاحية المشرف';return}
  $('loginView').style.display='none';
  try{if(!localStorage.getItem('tk_notrack')){localStorage.setItem('tk_notrack','1');toast('ما راح نحسب زياراتك من هذا الجهاز')}}catch(e){}
  syncNotrack();load();
  clearInterval(timer);timer=setInterval(function(){if(!document.hidden)load(true)},60000);
}
sb.auth.getSession().then(function(x){if(x.data.session)enter(x.data.session.user)});
$('loginForm').onsubmit=async function(e){
  e.preventDefault();$('loginErr').textContent='';$('loginBtn').disabled=true;
  var r=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  $('loginBtn').disabled=false;
  if(r.error){$('loginErr').textContent=/Invalid/i.test(r.error.message)?'كلمة المرور غلط':r.error.message;return}
  enter(r.data.user);
};
$('logout').onclick=async function(){await sb.auth.signOut();location.reload()};
$('refresh').onclick=function(){load()};
Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){
  c.onclick=function(){range=c.getAttribute('data-r');Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(x){x.setAttribute('aria-pressed',x===c)});load()};
});
$('purge').onclick=async function(){
  if(!confirm('تحذف كل الزيارات الأقدم من سنة؟ هذا يوفر مساحة في الباقة المجانية وما يمكن التراجع عنه.'))return;
  var d=new Date();d.setFullYear(d.getFullYear()-1);
  var r=await sb.from('site_visits').delete().lt('created_at',d.toISOString());
  toast(r.error?'❌ '+r.error.message:'✅ تم حذف الزيارات القديمة',4000);
};
function syncNotrack(){try{$('notrack').checked=localStorage.getItem('tk_notrack')==='1'}catch(e){}}
$('notrack').onchange=function(){
  try{if(this.checked)localStorage.setItem('tk_notrack','1');else localStorage.removeItem('tk_notrack')}catch(e){}
  toast(this.checked?'ما راح نحسب زياراتك من هذا الجهاز':'زياراتك من هذا الجهاز راح تنحسب');
};

/* ---------- data ---------- */
async function fetchAll(from,after){
  var out=[],step=1000;
  for(var i=0;i<MAX_ROWS;i+=step){
    var r=await sb.from('site_visits').select('created_at,visitor,session,page,source,country,country_code,region,city,lat,lon,device,os,browser')
      [after?'gt':'gte']('created_at',after||from.toISOString()).order('created_at',{ascending:false}).range(i,i+step-1);
    if(r.error)throw r.error;
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<step)break;
  }
  return out;
}
async function load(silent){
  if(busy)return;busy=true;
  if(!silent)$('body').innerHTML='<div class="empty">جارٍ التحميل…</div>';
  try{
    /* التحديث التلقائي يجيب الزيارات الجديدة بس، عشان ما نستهلك من الباقة المجانية */
    var from=since();
    if(silent&&rows.length&&loadedRange===range){
      var fresh=await fetchAll(from,rows[0].created_at);
      rows=fresh.concat(rows).filter(function(r){return new Date(r.created_at)>=from}).slice(0,MAX_ROWS);
    }else{rows=await fetchAll(from);loadedRange=range}
    var live=await sb.from('site_visits').select('visitor').gte('created_at',new Date(Date.now()-5*60000).toISOString()).limit(1000);
    if(live.error)throw live.error;
    render(new Set((live.data||[]).map(function(r){return r.visitor})).size);
    $('updated').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-AE',{hour:'numeric',minute:'2-digit'});
  }catch(e){
    if(/site_visits|does not exist|schema cache|42P01|PGRST205/i.test((e.code||'')+' '+(e.message||'')))setup();
    else $('body').innerHTML='<div class="empty">تعذر التحميل: '+esc(e.message||e)+'</div>';
  }
  busy=false;
}
function setup(){
  map=null;
  $('body').innerHTML='<div class="setup"><b>خطوة وحدة قبل أول استخدام:</b><br>افتح Supabase ← مشروع تنوركو ← <b>SQL Editor</b> ← الصق هذا الكود واضغط <b>Run</b>، وبعدها اضغط «تحديث». من هذي اللحظة يبدأ الموقع يسجل الزوار.<pre id="sql">'+esc(SQL)+'</pre><button class="btn primary" id="sqlCopy" type="button">📋 نسخ الكود</button></div>';
  $('sqlCopy').onclick=function(){
    (navigator.clipboard?navigator.clipboard.writeText(SQL):Promise.reject()).then(function(){toast('✅ تم نسخ الكود')},function(){
      var r=document.createRange();r.selectNodeContents($('sql'));var s=getSelection();s.removeAllRanges();s.addRange(r);toast('حدد الكود وانسخه');
    });
  };
}
function count(key){
  var m=new Map();
  rows.forEach(function(r){var k=key(r);if(k==null)return;var o=m.get(k);if(!o){o={k:k,n:0,v:new Set(),r:r};m.set(k,o)}o.n++;o.v.add(r.visitor)});
  return Array.from(m.values()).sort(function(a,b){return b.n-a.n});
}
function bars(list,label,limit){
  if(!list.length)return '<div class="empty">ما في بيانات</div>';
  var max=list[0].n;
  return '<ul class="bars">'+list.slice(0,limit||8).map(function(o){
    return '<li><span class="fill" style="width:'+Math.max(3,o.n/max*100).toFixed(1)+'%"></span><span class="nm">'+label(o)+'</span><span class="n">'+num(o.n)+'</span></li>';
  }).join('')+'</ul>';
}
function days(){
  var n=range==='today'?0:+range;
  if(!n){
    var hrs=new Array(24).fill(0);rows.forEach(function(r){hrs[new Date(r.created_at).getHours()]++});
    var mx=Math.max.apply(null,hrs)||1,now=new Date().getHours();
    return '<div class="days">'+hrs.slice(0,now+1).map(function(v,h){
      return '<div class="d" title="'+h+':00 — '+v+' زيارة"><b>'+(v||'')+'</b><i style="height:'+(v/mx*100)+'%"></i><small>'+(h%3===0?h:'')+'</small></div>';
    }).join('')+'</div>';
  }
  var keys=[],cnt={},d=new Date();d.setHours(0,0,0,0);
  for(var i=n-1;i>=0;i--){var x=new Date(d);x.setDate(d.getDate()-i);var k=x.toDateString();keys.push([k,x]);cnt[k]=0}
  rows.forEach(function(r){var k=new Date(r.created_at).toDateString();if(k in cnt)cnt[k]++});
  var mx2=Math.max.apply(null,keys.map(function(k){return cnt[k[0]]}))||1;
  var every=n>30?14:n>7?5:1;
  return '<div class="days">'+keys.map(function(k,i){
    var v=cnt[k[0]];
    return '<div class="d" title="'+k[1].toLocaleDateString('ar-AE',{day:'numeric',month:'short'})+' — '+v+' زيارة"><b>'+(n<=31&&v?v:'')+'</b><i style="height:'+(v/mx2*100)+'%"></i><small>'+((keys.length-1-i)%every===0?k[1].getDate()+'/'+(k[1].getMonth()+1):'')+'</small></div>';
  }).join('')+'</div>';
}
function placeName(r){
  var p=[r.city,r.region&&r.region!==r.city?r.region:null].filter(Boolean).join('، ');
  return flag(r.country_code)+' '+esc(p?p+' — '+countryName(r):countryName(r));
}
function render(liveCount){
  var visitors=new Set(rows.map(function(r){return r.visitor})).size;
  var countries=count(function(r){return r.country_code||r.country||null});
  var cities=count(function(r){return r.city?(r.city+'|'+(r.country_code||'')):null});
  var pages=count(function(r){return r.page});
  var sources=count(function(r){return r.source});
  var devices=count(function(r){return r.device});
  var oss=count(function(r){return r.os});
  var lbl=range==='today'?'اليوم':'آخر '+range+' يوم';
  var h='<div class="kpis">'+
    '<div class="kpi live"><div class="v">'+num(liveCount)+'</div><div class="l">متواجدين الحين (آخر 5 دقايق)</div></div>'+
    '<div class="kpi"><div class="v">'+num(visitors)+'</div><div class="l">زوار مختلفين — '+lbl+'</div></div>'+
    '<div class="kpi"><div class="v">'+num(rows.length)+'</div><div class="l">عدد الزيارات (فتح صفحة)</div></div>'+
    '<div class="kpi"><div class="v">'+num(countries.length)+'</div><div class="l">دول</div></div></div>';
  if(rows.length>=MAX_ROWS)h+='<p class="empty">يعرض آخر '+num(MAX_ROWS)+' زيارة فقط.</p>';
  h+='<div class="card"><h2>🗺️ أماكن الزوار على الخريطة</h2><div id="map" role="img" aria-label="خريطة أماكن الزوار"></div></div>';
  h+='<div class="card"><h2>📈 '+(range==='today'?'الزيارات حسب الساعة':'الزيارات حسب اليوم')+'</h2>'+days()+'</div>';
  h+='<div class="stack"><div class="cols">'+
    '<div class="card"><h2>🌍 الدول</h2>'+bars(countries,function(o){return flag(o.r.country_code)+' '+esc(countryName(o.r))})+'</div>'+
    '<div class="card"><h2>🏙️ المدن</h2>'+bars(cities,function(o){return flag(o.r.country_code)+' '+esc(o.r.city)})+'</div>'+
    '<div class="card"><h2>📄 الصفحات</h2>'+bars(pages,function(o){return esc(pageName(o.k))})+'</div>'+
    '<div class="card"><h2>🧭 من وين جاو</h2>'+bars(sources,function(o){return esc(sourceName(o.k))})+'</div>'+
    '<div class="card"><h2>📱 الأجهزة</h2>'+bars(devices,function(o){return esc(DEVICES[o.k]||o.k)})+'</div>'+
    '<div class="card"><h2>⚙️ نظام التشغيل</h2>'+bars(oss,function(o){return esc(o.k)})+'</div>'+
  '</div></div>';
  h+='<div class="card"><h2>🕒 آخر الزيارات</h2>'+(rows.length?'<ul class="recent">'+
    rows.slice(0,40).map(function(r){
      return '<li><div class="r1"><span>'+placeName(r)+'</span><span class="t">'+esc(ago(r.created_at))+'</span></div><div class="r2">'+esc(pageName(r.page))+' · '+esc(DEVICES[r.device]||r.device||'')+(r.os?' '+esc(r.os):'')+' · '+esc(sourceName(r.source))+'</div></li>';
    }).join('')+'</ul>':'<div class="empty">ما في زيارات في هذي الفترة لين الحين.</div>')+'</div>';
  if(map){try{mapView=[map.getCenter(),map.getZoom()]}catch(e){}map.remove();map=null}
  if(loadedRange!==range)mapView=null;
  $('body').innerHTML=h;
  drawMap();
}
function drawMap(){
  if(!window.L){$('map').innerHTML='<div class="empty">تعذر تحميل الخريطة</div>';return}
  map=L.map('map',{scrollWheelZoom:false,attributionControl:true}).setView([24.2,55.7],6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);
  var pts=count(function(r){return r.lat!=null&&r.lon!=null?(r.lat.toFixed(2)+','+r.lon.toFixed(2)):null});
  if(!pts.length)return;
  var max=pts[0].n,b=[];
  pts.forEach(function(o){
    var ll=[o.r.lat,o.r.lon];b.push(ll);
    L.circleMarker(ll,{radius:6+Math.sqrt(o.n/max)*18,color:'#a8451e',weight:2,fillColor:'#d9691f',fillOpacity:.55})
      .bindPopup('<div dir="rtl" style="text-align:right"><b>'+placeName(o.r)+'</b><br>'+num(o.n)+' زيارة · '+num(o.v.size)+' زائر</div>').addTo(map);
  });
  if(mapView)map.setView(mapView[0],mapView[1]);
  else if(b.length===1)map.setView(b[0],9);else map.fitBounds(b,{padding:[30,30],maxZoom:10});
}
})();
</script>
