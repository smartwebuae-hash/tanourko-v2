<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

  :root{
    --umber-dark:#3c1c0e;
    --gold:#f0ac3f;
    --gold-pale:#f8d896;
    --cream:#faf1e2;
    --ink:#241109;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .star{
    position:absolute;bottom:-10px;background:#fff;border-radius:50%;opacity:0;
    animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite;
    box-shadow:0 0 4px rgba(255,255,255,0.85);

  @keyframes rise{
    0%{transform:translateY(0);opacity:0;}
    8%{opacity:1;}
    92%{opacity:1;}
    100%{transform:translateY(-110vh) translateX(var(--drift,0px));opacity:0;}
  }

  .wrap{position:relative;z-index:1;width:100%;max-width:460px;text-align:center;}

  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(36,17,9,0.4);border:1.5px solid rgba(250,241,226,0.4);
    color:var(--cream);text-decoration:none;font-size:13px;font-weight:700;
    padding:8px 16px;border-radius:100px;margin-bottom:16px;
  }

  .logo{width:110px;max-width:45%;margin:0 auto 8px;}

  .page-title{font-size:23px;font-weight:900;margin-bottom:4px;}
  .page-sub{font-size:13px;opacity:0.85;margin-bottom:26px;}

  .refresh-btn{
    background:rgba(255,255,255,0.1);
    border:1.5px solid rgba(250,241,226,0.35);
    color:var(--cream);
    font-family:'Tajawal','FreeSerif',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:9px 18px;
    border-radius:100px;
    cursor:pointer;
    margin-bottom:22px;
  }

  .loading{
    font-size:14px;
    opacity:0.8;
    padding:30px 0;
  }

  .rank-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .rank-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:rgba(255,255,255,0.08);
    border:1.5px solid rgba(250,241,226,0.3);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-radius:18px;
    padding:14px 18px;
  }
  .rank-card.top1{
    background:linear-gradient(135deg, rgba(240,172,63,0.35), rgba(255,255,255,0.08));
    border-color:var(--gold);
  }
  .rank-medal{
    font-size:26px;
    flex:0 0 auto;
    width:36px;
  }
  .rank-info{
    flex:1;
    text-align:right;
  }
  .rank-name{
    font-size:17px;
    font-weight:800;
  }
  .rank-stars{
    font-size:13px;
    color:var(--gold-pale);
    margin-top:2px;
  }
  .rank-total{
    font-size:20px;
    font-weight:900;
    color:var(--gold);
    flex:0 0 auto;
  }

  .month-label{
    margin-top:26px;
    font-size:12px;
    opacity:0.7;
  }
</style>

  <div class="page-title">🏆 ترتيب الموظفين</div>
  <div class="page-sub">حسب مجموع النجوم هذا الشهر</div>

  <button class="refresh-btn" id="refreshBtn">🔄 تحديث الترتيب</button>

  <div id="content">
    <div class="loading">جاري تحميل الترتيب...</div>
  </div>

  <div class="month-label" id="monthLabel"></div>

</div>

<script>
  const container = document.getElementById('stars');
  const COUNT = 40;
  for(let i=0;i<COUNT;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = (Math.random()*2.2 + 0.8).toFixed(2);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random()*100) + 'vw';
    s.style.animationDuration = (Math.random()*9 + 7).toFixed(2) + 's';
    s.style.animationDelay = '-' + (Math.random()*16).toFixed(2) + 's';
    s.style.setProperty('--drift', (Math.random()*40 - 20) + 'px');
    s.style.opacity = (Math.random()*0.5 + 0.4).toFixed(2);
    container.appendChild(s);
  }

  const STAFF_NAMES = ['أمين','يوسف','هاجر','مريم','محمد','زينة','جنة','محمود','طه'];
  const COUNTER_BASE = 'https://countapi.mileshilliard.com/api/v1';

  function monthKey(staffName){
    const d = new Date();
    const monthStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    const safeName = encodeURIComponent(staffName);
    return `tanourko_${safeName}_${monthStr}`;
  }

  const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const now = new Date();
  document.getElementById('monthLabel').textContent = `شهر ${monthNames[now.getMonth()]} ${now.getFullYear()}`;

  function loadRanking(){
    const content = document.getElementById('content');
    content.innerHTML = '<div class="loading">جاري تحميل الترتيب...</div>';

    const promises = STAFF_NAMES.map(name =>
      fetch(`${COUNTER_BASE}/get/${monthKey(name)}`)
        .then(r => r.ok ? r.json() : { value: 0 })
        .then(data => ({ name: name, total: parseInt(data.value || 0, 10) }))
        .catch(() => ({ name: name, total: 0 }))
    );

    Promise.all(promises).then(results => {
      results.sort((a,b) => b.total - a.total);
      const medals = ['🥇','🥈','🥉'];
      let html = '<div class="rank-list">';
      results.forEach((r, i) => {
        if(r.total === 0) return; // نتجاهل الموظفين اللي ما عندهم أي تقييم بعد
        const medal = medals[i] || `#${i+1}`;
        html += `
          <div class="rank-card ${i===0 ? 'top1' : ''}">
            <div class="rank-medal">${medal}</div>
            <div class="rank-info">
              <div class="rank-name">${r.name}</div>
              <div class="rank-stars">مجموع النجوم هذا الشهر</div>
            </div>
            <div class="rank-total">${r.total}</div>
          </div>`;
      });
      html += '</div>';

      const anyData = results.some(r => r.total > 0);
      if(!anyData){
        html = '<div class="loading">ما فيه تقييمات مسجّلة هذا الشهر بعد</div>';
      }
      content.innerHTML = html;
    });
  }

  document.getElementById('refreshBtn').addEventListener('click', loadRanking);
  loadRanking();
</script>

</body>
</html>
